[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "openflightcomputer-tools"
version = "0.1.0"
description = "Host-side build, flash, inspection, and smoke-test tools for OpenFlightComputer"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pyserial>=3.5,<4"]

[project.scripts]
ofc = "openflightcomputer.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["."]
include = ["openflightcomputer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
